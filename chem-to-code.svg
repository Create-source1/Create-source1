<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Animation: a spinning molecule sends events through a service, a Kafka topic and a consumer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#50C878"/><stop offset="1" stop-color="#0E75B6"/>
    </linearGradient>
    <linearGradient id="gradLine" gradientUnits="userSpaceOnUse" x1="232" y1="0" x2="862" y2="0">
      <stop offset="0" stop-color="#50C878"/><stop offset="1" stop-color="#0E75B6"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#0B2530"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>text{font-family:'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace}</style>

  <rect x="1.5" y="1.5" width="897" height="297" rx="20" fill="url(#bg)" stroke="url(#grad)" stroke-width="2"/>

  <circle cx="40" cy="275" r="3" fill="none" stroke="#0E75B6" stroke-width="1">
      <animate attributeName="cy" values="280;40" dur="7s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="7s" begin="0s" repeatCount="indefinite"/>
    </circle><circle cx="85" cy="275" r="2" fill="none" stroke="#0E75B6" stroke-width="1">
      <animate attributeName="cy" values="280;40" dur="9s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="2s" repeatCount="indefinite"/>
    </circle><circle cx="250" cy="275" r="2.5" fill="none" stroke="#0E75B6" stroke-width="1">
      <animate attributeName="cy" values="280;40" dur="8s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="8s" begin="1s" repeatCount="indefinite"/>
    </circle><circle cx="300" cy="275" r="2" fill="none" stroke="#0E75B6" stroke-width="1">
      <animate attributeName="cy" values="280;40" dur="10s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="10s" begin="4s" repeatCount="indefinite"/>
    </circle><circle cx="350" cy="275" r="3" fill="none" stroke="#0E75B6" stroke-width="1">
      <animate attributeName="cy" values="280;40" dur="7.5s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="7.5s" begin="3s" repeatCount="indefinite"/>
    </circle><circle cx="860" cy="275" r="2" fill="none" stroke="#0E75B6" stroke-width="1">
      <animate attributeName="cy" values="280;40" dur="9s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="1.5s" repeatCount="indefinite"/>
    </circle><circle cx="600" cy="275" r="2" fill="none" stroke="#0E75B6" stroke-width="1">
      <animate attributeName="cy" values="280;40" dur="11s" begin="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="11s" begin="5s" repeatCount="indefinite"/>
    </circle>

  <text x="450" y="52" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">From Reactions to Events</text>
  <text x="450" y="76" text-anchor="middle" font-size="13" fill="#8b949e">chemistry lab  →  fintech backend</text>

  <!-- molecule -->
  <circle cx="150" cy="160" r="76" fill="none" stroke="#0E75B6" stroke-opacity="0.35" stroke-dasharray="3 7"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 150 160" to="360 150 160" dur="26s" repeatCount="indefinite"/>
    <polygon points="150.0,110.0 193.3,135.0 193.3,185.0 150.0,210.0 106.7,185.0 106.7,135.0" fill="none" stroke="#0E75B6" stroke-width="3.2" stroke-linejoin="round"/>
    <line x1="155.2" y1="123.0" x2="179.4" y2="137.0" stroke="#50C878" stroke-width="2.4" stroke-linecap="round"/><line x1="179.4" y1="183.0" x2="155.2" y2="197.0" stroke="#50C878" stroke-width="2.4" stroke-linecap="round"/><line x1="115.4" y1="174.0" x2="115.4" y2="146.0" stroke="#50C878" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="150.0" cy="110.0" r="6" fill="#50C878" filter="url(#glow)">
        <animate attributeName="r" values="5;8;5" dur="2.4s" begin="0.0s" repeatCount="indefinite"/>
      </circle><circle cx="193.3" cy="135.0" r="6" fill="#50C878" filter="url(#glow)">
        <animate attributeName="r" values="5;8;5" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
      </circle><circle cx="193.3" cy="185.0" r="6" fill="#50C878" filter="url(#glow)">
        <animate attributeName="r" values="5;8;5" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      </circle><circle cx="150.0" cy="210.0" r="6" fill="#50C878" filter="url(#glow)">
        <animate attributeName="r" values="5;8;5" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      </circle><circle cx="106.7" cy="185.0" r="6" fill="#50C878" filter="url(#glow)">
        <animate attributeName="r" values="5;8;5" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
      </circle><circle cx="106.7" cy="135.0" r="6" fill="#50C878" filter="url(#glow)">
        <animate attributeName="r" values="5;8;5" dur="2.4s" begin="2.0s" repeatCount="indefinite"/>
      </circle>
  </g>

  <!-- event path -->
  <line x1="232" y1="160" x2="862" y2="160" stroke="url(#gradLine)" stroke-width="2" stroke-dasharray="6 8" stroke-opacity="0.8"/>
  <circle cx="232" cy="160" r="4" fill="#50C878"/>
  <circle r="5" fill="#50C878" filter="url(#glow)">
      <animateMotion dur="5.1s" begin="0s" repeatCount="indefinite" path="M232,160 L862,160"/>
    </circle><circle r="5" fill="#50C878" filter="url(#glow)">
      <animateMotion dur="5.1s" begin="1.7s" repeatCount="indefinite" path="M232,160 L862,160"/>
    </circle><circle r="5" fill="#50C878" filter="url(#glow)">
      <animateMotion dur="5.1s" begin="3.4s" repeatCount="indefinite" path="M232,160 L862,160"/>
    </circle>

  <!-- pipeline boxes -->
  <g>
    <rect x="470" y="132" width="92" height="56" rx="12" fill="#0D1117" stroke="url(#grad)" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="5.1s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="516" y="165" text-anchor="middle" font-size="14" fill="#e6edf3">Service</text>
  </g>
  <g>
    <rect x="620" y="132" width="92" height="56" rx="12" fill="#0D1117" stroke="url(#grad)" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="5.1s" begin="2.6s" repeatCount="indefinite"/>
    </rect>
    <text x="666" y="165" text-anchor="middle" font-size="14" fill="#e6edf3">Kafka</text>
  </g>
  <g>
    <rect x="770" y="132" width="92" height="56" rx="12" fill="#0D1117" stroke="url(#grad)" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="5.1s" begin="4.0s" repeatCount="indefinite"/>
    </rect>
    <text x="816" y="165" text-anchor="middle" font-size="14" fill="#e6edf3">Consumer</text>
  </g>

  <text x="150" y="262" text-anchor="middle" font-size="14" fill="#8b949e">Chemistry</text>
  <text x="666" y="262" text-anchor="middle" font-size="14" fill="#8b949e">Event-driven backend</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>